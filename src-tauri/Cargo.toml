[package]
name = "degreeunlocker"
version = "1.0.0"
description = "DegreeUnlocker Desktop App"
authors = ["DegreeUnlocker Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [
  "shell-open",
  "fs-all",
  "dialog-all",
  "path-all",
  "http-all",
  "clipboard-all",
  "notification-all",
  "window-all"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
