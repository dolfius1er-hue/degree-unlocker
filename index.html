    <script>
      // Suppress harmless Vite HMR WebSocket connection errors
      const origConsoleError = console.error;
      console.error = function(...args) {
        if (args && args[0] && typeof args[0] === 'string' && args[0].includes('websocket')) {
          return;
        }
        origConsoleError.apply(console, args);
      };
    </script>
