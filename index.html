        100% { width: 97%; }
      }
      .splash-bar {
        animation: splashProgressNatural 2.2s cubic-bezier(0.1, 0.8, 0.15, 1) forwards;

      <!-- Synchronized 100% Responsive Progress Bar -->
      <div style="width:180px;height:4px;background:rgba(255,255,255,0.1);border-radius:99px;overflow:hidden;">
        <div class="splash-bar" style="height:100%;background:linear-gradient(90deg,#f59e0b,#fbbf24,#ffffff);border-radius:99px;"></div>
      </div>

    <div id="root"></div>

    <script>
      // Global milestone-based progress updater for real time synchronization
      window.splashProgress = 15;
      window.setSplashProgress = function(percent, force) {
        if (percent > window.splashProgress) {
          window.splashProgress = percent;
          const loader = document.getElementById('app-splash-loader');
          if (loader) {
            const bar = loader.querySelector('.splash-bar');
            if (bar) {
              bar.style.animation = 'none'; // Overrule continuous natural animation
              bar.style.width = percent + '%';
            }
          }
        }
        if (percent >= 100 || force) {
          const loader = document.getElementById('app-splash-loader');
          if (loader) {
            const bar = loader.querySelector('.splash-bar');
            if (bar) {
              bar.style.animation = 'none';
              bar.style.width = '100%';
            }
            // Transition immediately to reduce perceived loading latency
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 0.12s ease-out';
            setTimeout(function() {
              if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
            }, 120);
          }
        }
      };

      // Set initial HTML progress milestones
      window.setSplashProgress(30);
      window.addEventListener('DOMContentLoaded', function() {
        window.setSplashProgress(50);
      });

      // Backward compatible dismiss helper
      window.dismissSplashLoader = function() {
        window.setSplashProgress(100);
      };

      // Tauri Native PC Launcher Synchronization
      // Smoothly reveal window once the splash DOM has laid out, eliminating blank white frame stutter
      (function() {
        function revealTauriWindow() {
          try {
            if (window.__TAURI__ && window.__TAURI__.window && window.__TAURI__.window.appWindow) {
              window.__TAURI__.window.appWindow.show();
              window.__TAURI__.window.appWindow.setFocus();
            }
          } catch(e) {}
        }
        if (typeof window !== 'undefined' && ('__TAURI__' in window || '__TAURI_IPC__' in window || '__TAURI_METADATA__' in window)) {
          requestAnimationFrame(function() {
            revealTauriWindow();
          });
          window.addEventListener('DOMContentLoaded', revealTauriWindow);
          setTimeout(revealTauriWindow, 400);
        }
      })();

      // Suppress harmless Vite HMR WebSocket & dev noise, plus benign ResizeObserver alerts
      const origConsoleError = console.error;
      console.error = function(...args) {
        if (args && args[0] && typeof args[0] === 'string' && (args[0].includes('websocket') || args[0].includes('WebSocket') || args[0].includes('HMR'))) {
          return;
        }
        origConsoleError.apply(console, args);
      };

      const origConsoleWarn = console.warn;
      console.warn = function(...args) {
        if (args && args[0] && typeof args[0] === 'string' && (args[0].includes('ResizeObserver loop') || args[0].includes('non-passive event listener') || args[0].includes('Failed to connect to websocket'))) {
          return;
        }
        origConsoleWarn.apply(console, args);
      };
    </script>
